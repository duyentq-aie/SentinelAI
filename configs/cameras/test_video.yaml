# Per-camera geometry for test_video.mp4 (1280x720 after resize). Points are [x, y] in resized-frame pixels.
camera_id: test_video
source: test_video.mp4

# Red-light zone (a vehicle's bottom-centre inside it while the light is RED -> violation).
# Stop-line + crossing direction replace this in a later P2 step.
violation_zone: [[250, 250], [750, 250], [820, 380], [150, 380]]

# Optional "wrong lane" polygon for cars/trucks/buses; null = disabled (as in the original code).
wrong_lane_zone: null

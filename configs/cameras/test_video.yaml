# Per-camera geometry for test_video.mp4 (1280x720 after resize). Points are [x, y] in resized-frame pixels.
camera_id: test_video
source: test_video.mp4

# Red-light zone (a vehicle's bottom-centre inside it while the light is RED -> violation).
# Stop-line + crossing direction replace this in a later P2 step.
violation_zone: [[250, 250], [750, 250], [820, 380], [150, 380]]

# Optional "wrong lane" polygon for cars/trucks/buses; null = disabled (as in the original code).
wrong_lane_zone: null

# Traffic-light region (pixels of the 1280x720 frame): the countdown display of the signal at the top centre. Confirmed by the project owner on 2026-10-19 as the signal of this
# approach (experiments/EXP-022-light-roi). The light state is read from this region with OpenCV instead of the COCO detector.
light_roi: [590, 0, 632, 22]

# Red-light rule "stop_line_crossing" (rules.red_light.mode, the default). Geometry approved by the project owner on 2026-10-19 from experiments/EXP-022-light-roi/lanes_proposal.jpg.
# stop_line: just below the near edge of the zebra crossing (the queue waits below it). direction: entry direction (tail -> head), up the image.
stop_line: [[400, 302], [1040, 277]]
direction: [[650, 430], [665, 200]]
# A vehicle belongs to the lane that contains its crossing point. Lane signal: {roi: [x1, y1, x2, y2]} = the lane's own light (arrow), "shared" = light_roi, "exempt" = no light.
# Approved by the project owner on 2026-10-20 (experiments/EXP-022-light-roi/lane_signals): the arrow on the lane sign is the light that controls that lane.
# Precision first: a lane light that reads UNKNOWN never produces a violation; a crossing outside every lane is only counted/logged.
lanes:
  - name: left-turn
    signal: {roi: [466, 0, 530, 16]}      # arrow housing over the "LÀN RẼ TRÁI" sign; its green is thin and reads UNKNOWN now and then (harmless: UNKNOWN never raises a violation)
    polygon: [[400, 420], [400, 235], [560, 235], [560, 420]]
  - name: through
    signal: shared          # governed by the countdown in light_roi
    polygon: [[560, 420], [560, 235], [873, 235], [738, 420]]
  - name: right-turn
    signal: {roi: [845, 3, 898, 16]}      # three green arrows over the "LÀN RẼ PHẢI" sign (green all through test_video: the red case is untested)
    polygon: [[873, 235], [1048, 235], [1048, 420], [738, 420]]

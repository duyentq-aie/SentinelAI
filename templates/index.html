<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel AI - Traffic Node</title>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 20px; }
        .header h1 { color: #38bdf8; margin: 0; font-size: 2.2em; text-transform: uppercase; letter-spacing: 2px;}
        
        /* Control Panel Styles */
        .control-panel { background-color: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; align-items: center; flex-wrap: wrap;}
        
        input[type="text"] { flex-grow: 1; min-width: 300px; max-width: 400px; padding: 10px 15px; background-color: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 4px; font-size: 1em; }
        input[type="text"]:focus { outline: none; border-color: #38bdf8; }
        
        /* Upload Input Styling */
        input[type="file"] { background-color: #0f172a; color: #fff; border: 1px solid #475569; padding: 8px; border-radius: 4px; cursor: pointer; }
        input[type="file"]::file-selector-button { background-color: #475569; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; margin-right: 10px;}
        
        button { background-color: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #0369a1; }
        .btn-upload { background-color: #10b981; }
        .btn-upload:hover { background-color: #059669; }

        /* Main Layout Styles */
        .main-container { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; }
        
        /* Camera Feed */
        .camera-container { flex: 2; background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .camera-title { font-size: 1.2em; margin-bottom: 10px; font-weight: bold; color: #cbd5e1; display: flex; justify-content: space-between;}
        .status { color: #22c55e; font-size: 0.8em; animation: blink 2s infinite; }
        .camera-feed { width: 100%; border-radius: 4px; border: 2px solid #000; display: block; background-color: #000; min-height: 400px; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Violation Gallery */
        .gallery-container { flex: 1; background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); max-height: 800px; overflow-y: auto; }
        .gallery-title { font-size: 1.2em; font-weight: bold; color: #ef4444; margin-bottom: 15px; text-align: center; border-bottom: 1px solid #475569; padding-bottom: 10px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .plate-card { background: #0f172a; border: 1px solid #ef4444; border-radius: 5px; padding: 5px; text-align: center; box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2); }
        .plate-card img { width: 100%; height: auto; border-radius: 3px; }
        .plate-card p { margin: 5px 0 0 0; font-size: 12px; color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Sentinel AI Command Center</h1>
        <p>Real-time Traffic Violation Detection System</p>
    </div>

    <div class="main-container">
        <div class="camera-container">
            <div class="camera-title">
                <span id="cam-label">LIVE FEED: Waiting for input...</span>
                <span class="status">● AI PROCESSING ACTIVE</span>
            </div>
            <img id="video_stream" src="/video_feed" class="camera-feed" alt="Video Stream">
        </div>

        <div class="gallery-container">
            <div class="gallery-title">📸 VIOLATION RECORDS</div>
            <div class="gallery-grid" id="gallery">
            </div>
        </div>
    </div>

    <script>
        // Feature 1: Link Camera via URL/ID
        async function changeCamera() {
            const inputVal = document.getElementById('camera_input').value;
            const camLabel = document.getElementById('cam-label');
            
            if (!inputVal) {
                alert("Please enter a valid Camera URL or 0 for WebCam.");
                return;
            }

            camLabel.innerText = "🎥 CONNECTING... PLEASE WAIT";
            const formData = new FormData();
            formData.append("new_source", inputVal);

            try {
                const response = await fetch('/update_camera', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    camLabel.innerText = "🎥 LIVE FEED: " + inputVal;
                    document.getElementById('video_stream').src = "/video_feed?" + new Date().getTime();
                } else {
                    alert("Failed to connect to stream.");
                }
            } catch (error) { console.error("Error:", error); }
        }

        // Feature 2: Upload Local Video File
        async function uploadVideo() {
            const fileInput = document.getElementById('video_upload');
            const file = fileInput.files[0];
            const camLabel = document.getElementById('cam-label');

            if (!file) {
                alert("Please select a video file to upload.");
                return;
            }

            camLabel.innerText = "⏳ UPLOADING & ANALYZING...";
            const formData = new FormData();
            formData.append("file", file);

            try {
                const response = await fetch('/upload_video', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    camLabel.innerText = "🎥 LIVE FEED: " + data.filename;
                    // Force refresh the video stream
                    document.getElementById('video_stream').src = "/video_feed?" + new Date().getTime();
                } else {
                    alert("Upload failed.");
                    camLabel.innerText = "🎥 LIVE FEED: ERROR";
                }
            } catch (error) {
                console.error("Upload error:", error);
                alert("Error uploading file.");
            }
        }

        // Feature 3: Fetch violation plates automatically
        async function fetchViolations() {
            try {
                const response = await fetch('/api/violations');
                const data = await response.json();
                const gallery = document.getElementById('gallery');
                gallery.innerHTML = ''; 
                
                data.images.forEach(imgUrl => {
                    const card = document.createElement('div');
                    card.className = 'plate-card';
                    card.innerHTML = `<img src="${imgUrl}" alt="Plate"><p>VIOLATOR</p>`;
                    gallery.appendChild(card);
                });
            } catch (error) { console.error('Error fetching violations:', error); }
        }
        
        setInterval(fetchViolations, 2000);
        fetchViolations();
    </script>
</body>
</html>
